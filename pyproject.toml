[project]
name = "ping-painel"
version = "0.2.0"
description = "Painel de ping no terminal: média, 1% low, perda de pacote, beep e relatório PDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13",
    "reportlab>=4",
    "matplotlib>=3.7",
]

[project.scripts]
ping-painel = "ping_painel.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
